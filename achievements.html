<!DOCTYPE html>
<html lang="lv">
<head>
<!-- !! DROŠĪBA: auth.js — OBLIGĀTI PIRMĀ RINDA !! -->
<script src="/l/auth.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CEprep.lv — Sasniegumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
:root{ --bg:#08080b; --card:#101017; --card2:#14141c; --bd:rgba(255,255,255,.06); --bdh:rgba(255,255,255,.12); --t:#f4f5f7; --td:#a4a7b3; --tm:#6a6d7a; --cyan:#6cf0e0; --indigo:#7c8cff; --violet:#a78bfa; --amber:#fbbf24; --green:#34d399; --red:#f87171; --grad:linear-gradient(135deg,#7c8cff 0%,#56d4ff 55%,#6cf0e0 100%); --r:18px; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t);min-height:100%}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:0}
a{color:inherit}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none; background: radial-gradient(600px 400px at 12% -5%,rgba(124,140,255,.14),transparent 60%), radial-gradient(700px 500px at 105% 10%,rgba(108,240,224,.08),transparent 60%), radial-gradient(800px 600px at 50% 110%,rgba(86,212,255,.06),transparent 60%);}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:20px 16px 60px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 20px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--td);text-decoration:none;font-size:14px;font-weight:600}
.back-link:hover{color:var(--t)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;font-weight:800;margin:0}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:999px;padding:3px}
.seg-item{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--td);cursor:pointer}
.seg-item.active{color:#0b0b12;background:var(--grad)}

.hero-card{padding:26px 24px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--bd);border-radius:var(--r);display:flex;align-items:center;gap:20px;margin-bottom:22px}
.hero-ring{position:relative;width:76px;height:76px;flex:none}
.hero-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.hero-ring circle{fill:none;stroke-width:6}
.hero-ring .bg{stroke:rgba(255,255,255,.08)}
.hero-ring .fg{stroke:url(#heroGrad);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.16,.85,.24,1)}
.hero-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;font-weight:800;font-size:15px}
.hero-title{font-size:18px;font-weight:800}
.hero-sub{color:var(--td);font-size:13.5px;margin-top:3px}

.category-block{margin-bottom:26px}
.category-title{font-size:13px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.category-count{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--tm);font-size:12px}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach-card{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.ach-card.unlocked{border-color:rgba(108,240,224,.28);background:linear-gradient(160deg,rgba(124,140,255,.08),rgba(108,240,224,.04))}
.ach-card.locked{opacity:.55}
.ach-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:22px}
.ach-card.locked .ach-icon{filter:grayscale(1);opacity:.6}
.ach-name{font-size:13.5px;font-weight:700;line-height:1.3}
.ach-desc{font-size:11.5px;color:var(--tm);line-height:1.4}
.ach-progress-wrap{height:5px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:2px}
.ach-progress-bar{height:100%;border-radius:999px;background:var(--grad);transition:width .6s cubic-bezier(.16,.85,.24,1)}
.ach-progress-text{font-size:10.5px;color:var(--tm);font-family:"JetBrains Mono",monospace}
.ach-check{position:absolute;margin-top:-6px;margin-left:32px;width:18px;height:18px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#04140c}

.loading-state{text-align:center;padding:60px 20px;color:var(--tm);font-size:14px}
</style>
</head>
<body>
<div class="ambient"></div>

<main>
  <div class="topbar">
    <a href="/l/" class="back-link">
      <svg class="i" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      <span data-i="back">Sākumlapa</span>
    </a>
    <h1 data-i="pageTitle">🏆 Sasniegumi</h1>
    <div class="seg" role="tablist">
      <div class="seg-item active" data-lang="lv">LV</div>
      <div class="seg-item" data-lang="ru">RU</div>
    </div>
  </div>

  <div class="hero-card">
    <div class="hero-ring">
      <svg viewBox="0 0 76 76">
        <defs>
          <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c8cff"/>
            <stop offset="60%" stop-color="#56d4ff"/>
            <stop offset="100%" stop-color="#6cf0e0"/>
          </linearGradient>
        </defs>
        <circle class="bg" cx="38" cy="38" r="32"></circle>
        <circle class="fg" id="heroCircle" cx="38" cy="38" r="32"></circle>
      </svg>
      <div class="hero-num mono" id="heroNum">0/20</div>
    </div>
    <div>
      <div class="hero-title" data-i="heroTitle">Tavi sasniegumi</div>
      <div class="hero-sub" id="heroSub" data-i="heroSub">Turpini risināt uzdevumus, lai atklātu vairāk!</div>
    </div>
  </div>

  <div id="categoriesWrap">
    <div class="loading-state" data-i="loading">Ielādē…</div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let lang = localStorage.getItem('site_lang') === 'ru' ? 'ru' : 'lv';

const dict = {
  lv: { back:"Sākumlapa", pageTitle:"🏆 Sasniegumi", heroTitle:"Tavi sasniegumi", heroSub:"Turpini risināt uzdevumus, lai atklātu vairāk!", loading:"Ielādē…",
    catVolume:"Apjoms", catStreak:"Straiks", catAccuracy:"Precizitāte", catVariety:"Daudzveidība", catAdvanced:"Augstākais līmenis", catDuel:"Duelis", catHidden:"Slēptie",
    loginRequired:"Vispirms jāpieslēdzas." },
  ru: { back:"Главная", pageTitle:"🏆 Достижения", heroTitle:"Твои достижения", heroSub:"Продолжай решать задания, чтобы открыть больше!", loading:"Загрузка…",
    catVolume:"Объём", catStreak:"Стрик", catAccuracy:"Точность", catVariety:"Разнообразие", catAdvanced:"Высший уровень", catDuel:"Дуэли", catHidden:"Скрытые",
    loginRequired:"Сначала нужно войти." }
};

const ACHIEVEMENTS_META = {
  solved_1:    { icon:"🌱", lv:["Pirmie soļi","Atrisināts pirmais uzdevums"], ru:["Первые шаги","Решено первое задание"] },
  solved_10:   { icon:"📘", lv:["Iesācējs","Atrisināti 10 uzdevumi"], ru:["Начинающий","Решено 10 заданий"] },
  solved_50:   { icon:"📗", lv:["Pārliecinātais","Atrisināti 50 uzdevumi"], ru:["Уверенный","Решено 50 заданий"] },
  solved_100:  { icon:"📙", lv:["Maratonists","Atrisināti 100 uzdevumi"], ru:["Марафонец","Решено 100 заданий"] },
  solved_250:  { icon:"🏆", lv:["Apjoma leģenda","Atrisināti 250 uzdevumi"], ru:["Легенда объёма","Решено 250 заданий"] },
  solved_500:  { icon:"👑", lv:["Nesatricināms","Atrisināti 500 uzdevumi"], ru:["Несокрушимый","Решено 500 заданий"] },
  streak_7:    { icon:"🔥", lv:["Nedēļa pēc kārtas","7 dienu straiks"], ru:["Неделя подряд","Стрик 7 дней"] },
  streak_30:   { icon:"⚡", lv:["Mēnesis pēc kārtas","30 dienu straiks"], ru:["Месяц подряд","Стрик 30 дней"] },
  streak_100:  { icon:"💎", lv:["Dzelzs griba","100 dienu straiks"], ru:["Железная воля","Стрик 100 дней"] },
  accuracy_10: { icon:"🎯", lv:["Snaiperis","10 pareizas atbildes pēc kārtas"], ru:["Снайпер","10 верных ответов подряд"] },
  accuracy_25: { icon:"🧠", lv:["Perfekcionists","25 pareizas atbildes pēc kārtas"], ru:["Идеалист","25 верных ответов подряд"] },
  all_skills:  { icon:"🎓", lv:["Universālists","Katra prasme izmēģināta"], ru:["Универсал","Опробован каждый навык"] },
  al_first:    { icon:"🚀", lv:["Augstākā līga","Pirmais AL uzdevums"], ru:["Высшая лига","Первое задание AL"] },
  al_20:       { icon:"🌟", lv:["AL iekarotājs","20 AL uzdevumi"], ru:["Покоритель AL","20 заданий AL"] },
  duel_first_win: { icon:"⚔️", lv:["Pirmās asinis","Pirmā uzvara dueli"], ru:["Первая кровь","Первая победа в дуэли"] },
  duel_10_wins:   { icon:"🗡️", lv:["Duelants","10 uzvaras duelos"], ru:["Дуэлянт","10 побед в дуэлях"] },
  duel_streak_5:  { icon:"🔱", lv:["Neuzvarams","5 uzvaras pēc kārtas"], ru:["Непобедимый","5 побед подряд"] },
  duel_master_tier: { icon:"👊", lv:["Meistars+","Sasniegts Meistara rangs"], ru:["Мастер+","Достигнут ранг Мастер"] },
  night_owl:   { icon:"🦉", lv:["Pūce","Uzdevums atrisināts naktī (00-05)"], ru:["Сова","Задание решено ночью (00-05)"] },
  early_bird:  { icon:"🐦", lv:["Agrā cīrulīte","Uzdevums atrisināts pirms 7:00"], ru:["Ранняя пташка","Задание решено до 7:00"] }
};

const CATEGORY_ORDER = [
  { id: "volume", key: "catVolume", ids: ["solved_1","solved_10","solved_50","solved_100","solved_250","solved_500"] },
  { id: "streak", key: "catStreak", ids: ["streak_7","streak_30","streak_100"] },
  { id: "accuracy", key: "catAccuracy", ids: ["accuracy_10","accuracy_25"] },
  { id: "variety", key: "catVariety", ids: ["all_skills"] },
  { id: "advanced", key: "catAdvanced", ids: ["al_first","al_20"] },
  { id: "duel", key: "catDuel", ids: ["duel_first_win","duel_10_wins","duel_streak_5","duel_master_tier"] },
  { id: "hidden", key: "catHidden", ids: ["night_owl","early_bird"] }
];

function t() { return dict[lang]; }
function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function applyLang() {
  document.documentElement.lang = lang;
  $$('[data-i]').forEach(el => { const k = el.dataset.i; if (t()[k]) el.textContent = t()[k]; });
}

async function loadAchievements() {
  const token = localStorage.getItem("session_token");
  const wrap = $("#categoriesWrap");
  if (!token) { wrap.innerHTML = '<div class="loading-state">' + t().loginRequired + '</div>'; return; }

  try {
    const res = await fetch("https://auth-worker.gegeodin.workers.dev/achievements", {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify({})
    });
    if (!res.ok) { wrap.innerHTML = '<div class="loading-state">Error</div>'; return; }
    const data = await res.json();
    render(data);
  } catch (e) {
    wrap.innerHTML = '<div class="loading-state">Error</div>';
  }
}

function render(data) {
  const achById = {};
  data.achievements.forEach(a => achById[a.id] = a);

  $("#heroNum").textContent = data.unlockedCount + "/" + data.totalCount;
  const circumference = 2 * Math.PI * 32;
  const circle = $("#heroCircle");
  circle.style.strokeDasharray = circumference;
  const frac = data.unlockedCount / data.totalCount;
  circle.style.strokeDashoffset = circumference * (1 - frac);

  const wrap = $("#categoriesWrap");
  wrap.innerHTML = CATEGORY_ORDER.map(cat => {
    const catAchieved = cat.ids.filter(id => achById[id] && achById[id].achieved).length;
    const cardsHtml = cat.ids.map(id => {
      const meta = ACHIEVEMENTS_META[id];
      const a = achById[id] || { achieved: false, progress: 0, progressMax: 1 };
      const nameDesc = meta[lang] || meta.lv;
      const pct = Math.min(100, Math.round((a.progress / a.progressMax) * 100));
      return '<div class="ach-card ' + (a.achieved ? "unlocked" : "locked") + '">' +
        '<div class="ach-icon">' + meta.icon + '</div>' +
        '<div class="ach-name">' + esc(nameDesc[0]) + '</div>' +
        '<div class="ach-desc">' + esc(nameDesc[1]) + '</div>' +
        (!a.achieved ? '<div class="ach-progress-wrap"><div class="ach-progress-bar" style="width:' + pct + '%"></div></div><div class="ach-progress-text">' + a.progress + ' / ' + a.progressMax + '</div>' : '') +
      '</div>';
    }).join("");

    return '<div class="category-block">' +
      '<div class="category-title">' + t()[cat.key] + ' <span class="category-count">' + catAchieved + '/' + cat.ids.length + '</span></div>' +
      '<div class="ach-grid">' + cardsHtml + '</div>' +
    '</div>';
  }).join("");
}

$$('.seg-item[data-lang]').forEach(el => {
  el.addEventListener('click', () => {
    $$('.seg-item[data-lang]').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    lang = el.dataset.lang;
    localStorage.setItem('site_lang', lang);
    applyLang();
    loadAchievements();
  });
});

function init() {
  $$('.seg-item[data-lang]').forEach(x => x.classList.toggle('active', x.dataset.lang === lang));
  applyLang();
  loadAchievements();
}
if (window.authReady) init();
else document.addEventListener("auth-ready", init, { once: true });
</script>
</body>
</html>
